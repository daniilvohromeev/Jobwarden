spring:
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://localhost:5432/jgk
    username: jgk
    password: jgk

jgk:
  enabled: true
  worker-id: ${HOSTNAME:local-webflux-worker}
  schedule-batch-size: 128
  claim-batch-size: 64
  max-running-global: 64
  heartbeat-interval: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
